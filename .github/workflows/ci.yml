name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── TypeScript + Node tests ────────────────────────────────────────────────
  node:
    name: TypeScript (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # ── Kotlin JVM unit tests (no emulator) ───────────────────────────────────
  kotlin:
    name: Kotlin JVM tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Run unit tests
        # testDebugUnitTest runs DnsPacketTest + PolicyEngineTest on the JVM.
        # We exclude instrumented tests (no emulator available in CI).
        run: ./gradlew :cloak:testDebugUnitTest --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-report
          path: android/build/reports/tests/testDebugUnitTest/
