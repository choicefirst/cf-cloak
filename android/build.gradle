apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
    namespace = "app.choicefirst.eu.cloak"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests.all {
            // Include all JUnit4 results under the standard report directory.
        }
    }
}

dependencies {
    // Capacitor is provided by the host app at runtime; compileOnly keeps it
    // out of the library's own artifact and the open-source dependency graph.
    compileOnly project(':capacitor-android')
    compileOnly "androidx.core:core:1.13.1"
    compileOnly "androidx.appcompat:appcompat:1.7.0"

    // Room — on-device event log (~500KB, worth it for ergonomics + query safety)
    implementation "androidx.room:room-runtime:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"

    // JVM unit tests (no Android framework, no emulator required)
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit:1.9.24"
    testImplementation "org.json:json:20240303"
}
