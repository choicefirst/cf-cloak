apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
    namespace = "app.choicefirst.cf.cloak"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Capacitor is provided by the host app at runtime; compileOnly keeps it
    // out of the library's own artifact and the open-source dependency graph.
    compileOnly "com.capacitorjs:android:8.3.1"
    compileOnly "androidx.core:core:1.13.1"
    compileOnly "androidx.appcompat:appcompat:1.7.0"

    // Room — on-device event log (~500KB, worth it for ergonomics + query safety)
    implementation "androidx.room:room-runtime:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"
}
